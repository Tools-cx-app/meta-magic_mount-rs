cargo-features = ["codegen-backend"]

[workspace]
members = ["xtask"]

[package]
name = "magic_mount_rs"
version = "4.0.8"
edition = "2024"
description = "An implementation of a metamodule using Magic Mount, Based on MKSU, Template is from meta-overlay."
authors = ["mmrs developers"]
license = "GPL-v3"
readme = "docs/README.md"
repository = "https://github.com/Tools-cx-app/meta-magic_mount-rs/"

[package.metadata.magic_mount_rs]
name = "Magic Mount-rs"
update = "https://github.com/Tools-cx-app/meta-magic_mount-rs/raw/master/update/update.json"

[workspace.package]
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"

[dependencies]
anyhow.workspace = true
extattr = "1"
log = "0.4.33"
rustix = { version = "1.1.4", features = ["fs", "mount"] }
libc = "0.2.189"
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
regex-lite = "0.1.9"
tempfile = "3.27.0"
java-properties = "2.0.0"
encoding_rs = "0.8.35"
thiserror = "2.0.20"
rustc-hash = "2.1.3"
const_format = "0.2.36"
hex = "0.4.3"
parking_lot = "0.12.5"

[build-dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[profile.release]
overflow-checks = false
codegen-units = 1
lto = "fat"
opt-level = 3
strip = true

[profile.dev]
codegen-backend = "cranelift"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15.1"

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
ksu = { git = "https://github.com/Tools-cx-app/ksu.git", version = "0.2.0" }

[target.'cfg(not(target_os = "android"))'.dependencies]
env_logger = "0.11.11"

[workspace.lints.clippy]
disallowed_types = "deny"

[lints]
workspace = true
