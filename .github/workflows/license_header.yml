name: Manage License Headers

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  license-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: hawkeye
      - run: hawkeye check
